databaseChangeLog:
  - changeSet:
      id: create-cartoon-character-table
      author: vlad_a
      changes:
        createTable:
          tableName: cartoon_characters
          columns:
            - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: external_id
                type: varchar(255)
                constraints:
                  nullable: false
                  unique: true
            - column:
                name: name
                type: varchar(255)
            - column:
                name: status
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: gender
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: is_deleted
                type: boolean
                defaultValueBoolean: false
                constraints:
                  nullable: false
